<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HUBA Fragrances</title>
<meta name="description" content="HUBA Fragrances: women's, men's, unisex, Arabic and oud fragrances in 30, 50 and 100 ml. Find fragrances inspired by your favourite brands.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 26C4 14 12 5 27 5c1 14-6 22-18 21-1 0-2 0-3 0z' fill='%2305663b'/%3E%3Cpath d='M8 24C12 16 17 12 22 10' stroke='%23fbfcfa' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style id="css">
  @property --c { syntax: '<color>'; inherits: true; initial-value: #9ccc4f; }

  :root{
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
    --bg:#f7f9f6; --surface:#fbfcfa; --tint:#eef3ec;
    --ink:#033d24; --ink-soft:#47624f;
    --brand:#05663b; --brand-deep:#033d24; --on-brand:#fbfcfa; --leaf:#6bbf59;
    --line:rgba(5,102,59,.18); --line-strong:rgba(5,102,59,.42);
    --glass:rgba(255,255,255,.55); --glass-line:rgba(5,102,59,.42);
    --shadow:rgba(3,61,36,.18); --backdrop:rgba(3,30,18,.45);
    --danger:#a12b1f; --logo-filter:none;
    --pad: clamp(1rem, 4vw, 2.5rem);
    --serif:'Cormorant Garamond','Iowan Old Style',Georgia,serif;
    --sans:'Jost',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *,*::before,*::after{ box-sizing:inherit; }
  [hidden]{ display:none !important; }
  html{ scroll-behavior:smooth; scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 88px); }
  html,body{ margin:0; }
  body{
    background:var(--bg); color:var(--ink);
    font:400 1rem/1.6 var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(1200px 700px at 20% 15%, rgba(107,191,89,.10), transparent 60%),
      radial-gradient(1000px 600px at 85% 85%, rgba(5,102,59,.08), transparent 55%);
  }
  img,svg{ max-width:100%; }
  h1,h2,h3{ font-family:var(--serif); font-style:italic; font-weight:500; margin:0; }
  a{ color:inherit; }
  :focus-visible{ outline:2px solid var(--brand); outline-offset:3px; }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

  /* Buttons */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:.6rem;
    padding:.85rem 2rem; border-radius:999px;
    border:1px solid var(--brand); background:var(--brand); color:var(--on-brand);
    font:500 .76rem/1 var(--sans); letter-spacing:.2em; text-transform:uppercase; text-decoration:none;
    cursor:pointer; transition:background .25s, border-color .25s, transform .25s;
  }
  .btn:hover{ background:var(--brand-deep); border-color:var(--brand-deep); transform:translateY(-1px); }
  .btn.ghost{ background:transparent; color:var(--brand); }
  .btn.ghost:hover{ background:var(--tint); border-color:var(--brand); }
  .btn.small{ padding:.65rem 1.1rem; font-size:.68rem; letter-spacing:.16em; }
  .btn:disabled{ opacity:.55; cursor:not-allowed; transform:none; }
  .link{ background:none; border:0; padding:0; color:inherit; font:inherit; cursor:pointer; text-align:left; }
  .link:hover{ text-decoration:underline; text-underline-offset:3px; }

  /* Header */
  .site-header{
    position:sticky; top:env(safe-area-inset-top, 0px); z-index:20;
    background:var(--bg); border-bottom:1px solid var(--line);
  }
  .bar{ max-width:1180px; margin:0 auto; padding:.7rem var(--pad); display:flex; align-items:center; gap:1.5rem; }
  .brand{ display:block; line-height:0; }
  .logo{ height:44px; width:auto; display:block; filter:var(--logo-filter); }
  .bar nav{ margin-left:auto; display:flex; gap:1.8rem; }
  .bar nav a{ text-decoration:none; font-size:.98rem; }
  .bar nav a:hover,.nav-btn:hover{ text-decoration:underline; text-underline-offset:4px; }
  .bar nav{ align-items:center; }
  .nav-btn{ display:inline-flex; align-items:center; gap:.45rem; min-height:44px; padding:0; border:0; background:none; color:inherit; font:inherit; font-size:.98rem; cursor:pointer; }
  .nav-btn[aria-expanded="true"] svg{ transform:rotate(180deg); }
  .nav-btn.active,.bar nav a[aria-current="page"]{ text-decoration:underline; text-decoration-color:var(--brand); text-decoration-thickness:2px; text-underline-offset:6px; }
  .menu{ position:absolute; left:0; right:0; top:100%; background:var(--surface); border-bottom:1px solid var(--line); box-shadow:0 22px 30px -22px var(--shadow); }
  .menu{ max-height:calc(100dvh - var(--hdr, 70px) - 12px); overflow:auto; }
  .menu-in{ max-width:1180px; margin:0 auto; padding:1rem var(--pad) 1.4rem; }
  .menu-links{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:.4rem .8rem; }
  .menu-link{ display:flex; flex-direction:column; gap:.1rem; padding:.7rem .9rem; border-left:2px solid var(--line); text-decoration:none; }
  .menu-link b{ font:italic 500 1.35rem/1.15 var(--serif); }
  .menu-link span{ color:var(--ink-soft); font-size:.88rem; }
  .menu-link:hover,.menu-link[aria-current="page"]{ border-left-color:var(--brand); background:var(--tint); }
  .cart-btn{ display:inline-flex; align-items:center; gap:.6rem; min-height:44px; padding:0 1.1rem; border-radius:999px;
    border:1px solid var(--line-strong); background:transparent; color:var(--ink); font:500 .95rem var(--sans); cursor:pointer; }
  .cart-btn:hover{ background:var(--tint); }
  .cart-count{ min-width:1.5rem; height:1.5rem; padding:0 .4rem; border-radius:999px; background:var(--brand); color:var(--on-brand);
    display:inline-grid; place-items:center; font-size:.8rem; }
  .cart-count[data-zero="true"]{ background:var(--tint); color:var(--ink-soft); }

  /* Hero */
  .hero{
    max-width:1180px; margin:0 auto; padding:clamp(2rem,6vw,5rem) var(--pad);
    display:grid; grid-template-columns:1.1fr .9fr; gap:clamp(2rem,6vw,5rem); align-items:center;
  }
  .hero h1{ font-size:clamp(2.7rem,6.2vw,4.8rem); line-height:1.04; max-width:13ch; margin-bottom:1.2rem; }
  .lede{ color:var(--ink-soft); max-width:44ch; margin:0 0 2rem; font-size:1.06rem; }
  .fam-picker{ display:flex; flex-wrap:wrap; gap:.5rem; margin-bottom:1.3rem; }
  .chip{
    border:1px solid var(--line-strong); background:transparent; color:var(--ink);
    border-radius:999px; padding:.5rem 1.15rem; min-height:40px; font:400 .95rem var(--sans); cursor:pointer;
    transition:background .2s, color .2s;
  }
  .chip:hover{ background:var(--tint); }
  .chip[aria-pressed="true"]{ background:var(--brand); color:var(--on-brand); border-color:var(--brand); }
  .fam-detail{ min-height:5.4rem; margin-bottom:1.5rem; max-width:46ch; }
  .fam-detail p{ margin:0 0 .4rem; }
  .fam-notes{ color:var(--ink-soft); font-size:.95rem; }
  .hero-actions{ display:flex; gap:.8rem; flex-wrap:wrap; }
  .arch{
    justify-self:center; width:min(100%,400px); aspect-ratio:4/5;
    border:1px solid var(--line-strong); border-radius:999px 999px 0 0;
    background:radial-gradient(closest-side at 50% 58%, color-mix(in srgb, var(--c) 30%, transparent), transparent 82%), var(--tint);
    display:grid; place-items:end center; padding-bottom:7%;
    transition:--c .7s ease;
  }
  .arch .bottle{ width:74%; height:auto; }
  @keyframes rise{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }
  .hero > *{ animation:rise 1.1s cubic-bezier(.2,.9,.25,1) both; }
  .hero > .arch{ animation-delay:.12s; }

  /* Bottle svg */
  .bottle .s1{ stop-color:var(--c); stop-opacity:.7; }
  .bottle .s2{ stop-color:var(--c); }
  .bottle .glass{ fill:var(--glass); stroke:var(--glass-line); stroke-width:1.5; }
  .bottle .g-fill{ fill:var(--glass); }
  .bottle .g-line{ fill:none; stroke:var(--glass-line); stroke-width:1.5; }

  nav a[aria-current="page"]{ text-decoration:underline; text-decoration-color:var(--brand); text-decoration-thickness:2px; text-underline-offset:6px; }

  /* Category tiles and page headers */
  .cats{ max-width:1180px; margin:0 auto; padding:0 var(--pad) clamp(1.5rem,4vw,3rem); display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:1rem; }
  .cat{ display:flex; flex-direction:column; gap:.2rem; padding:1.4rem 1.5rem; border:1px solid var(--line-strong); border-radius:4px;
    background:var(--surface); text-decoration:none; transition:background .2s, border-color .2s; }
  .cat:hover{ background:var(--tint); border-color:var(--brand); }
  .cat b{ font:italic 500 1.9rem/1.1 var(--serif); }
  .cat span{ color:var(--ink-soft); font-size:.92rem; }
  .page-head{ max-width:1180px; margin:0 auto; padding:clamp(2rem,5vw,3.5rem) var(--pad) 0; }
  .page-head h1,.about-page h1{ font-size:clamp(2.6rem,6vw,4.2rem); line-height:1.05; }
  .page-head p{ color:var(--ink-soft); max-width:52ch; margin:.8rem 0 0; font-size:1.06rem; }
  .page-head + .shop{ padding-top:clamp(1.5rem,3vw,2.5rem); }

  .brand-band{ background:var(--surface); border-block:1px solid var(--line); margin-bottom:clamp(1.5rem,4vw,2.5rem); }
  .bb-in{ max-width:1180px; margin:0 auto; padding:clamp(1.8rem,4vw,2.8rem) var(--pad); display:grid; grid-template-columns:1fr 1fr; gap:1.2rem clamp(2rem,5vw,4rem); align-items:center; }
  .bb-in h2{ font-size:clamp(1.8rem,3.4vw,2.4rem); }
  .bb-in p{ margin:.4rem 0 0; color:var(--ink-soft); }
  #brandForm{ display:flex; gap:.6rem; }
  #brandForm input{ flex:1; min-width:0; }
  .bb-in .brand-list{ grid-column:1 / -1; }
  .featured{ max-width:1180px; margin:0 auto; padding:clamp(1rem,3vw,2rem) var(--pad) clamp(1.5rem,4vw,3rem); }
  .featured .section-head{ margin-bottom:1.6rem; }
  .pd-brand .link{ text-decoration:underline; text-underline-offset:3px; }
  .disclaimer{ max-width:70ch; }
  .more{ text-align:center; margin-top:2.4rem; }
  .muted{ color:var(--ink-soft); font-size:.92rem; margin:.8rem 0 0; }

  /* About page */
  .about-page{ max-width:1180px; margin:0 auto; padding:clamp(2rem,5vw,3.5rem) var(--pad) clamp(3rem,6vw,5rem); }
  .about-page .lede{ margin:1rem 0 0; font-size:1.15rem; }
  .about-cols{ display:grid; grid-template-columns:1.2fr .8fr; gap:clamp(2rem,6vw,5rem); margin-top:2.5rem; }
  @media (min-width: 821px){ .about-side{ margin-top:-7.5rem; } }
  .about-copy p{ margin:0 0 1rem; font-size:1.08rem; max-width:58ch; }
  .about-copy h2,.about-side h2{ font-size:1.9rem; margin:2.2rem 0 .9rem; }
  .about-side h2:first-child{ margin-top:0; }
  .about-links{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:.8rem; }
  .about-photo{ aspect-ratio:4/5; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--tint); margin-bottom:1.6rem; }
  .about-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .about-photo-empty{ width:100%; height:100%; display:grid; place-items:center; gap:.6rem; justify-items:center; color:var(--ink-soft); }
  .about-photo-empty span{ font-size:.9rem; }
  .brand-list{ display:flex; flex-wrap:wrap; gap:.5rem; }
  .contact dd a{ color:inherit; }

  /* Sections */
  .shop{ max-width:1180px; margin:0 auto; padding:clamp(2rem,5vw,4rem) var(--pad) clamp(3rem,6vw,5rem); }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:1rem; flex-wrap:wrap; margin-bottom:1.4rem; }
  h2{ font-size:clamp(2.1rem,4vw,2.9rem); line-height:1.1; }
  .count{ color:var(--ink-soft); font-size:.95rem; }
  .toolbar{ display:flex; flex-wrap:wrap; gap:1rem 1.5rem; align-items:center; justify-content:space-between;
    padding:1rem 0; border-block:1px solid var(--line); margin-bottom:2rem; }
  .seg,.controls{ display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; }
  .controls{ gap:.8rem 1.2rem; }
  .field{ display:flex; align-items:center; gap:.5rem; font-size:.9rem; color:var(--ink-soft); }
  select,input[type="search"],input[type="text"],input[type="email"],input[type="tel"],input[type="number"],input[type="password"],textarea{
    font:400 .95rem var(--sans); color:var(--ink); background:var(--surface);
    border:1px solid var(--line-strong); border-radius:6px; padding:.55rem .7rem; min-height:42px; max-width:100%;
  }
  textarea{ width:100%; resize:vertical; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:2.2rem 1.5rem; list-style:none; margin:0; padding:0; }
  .card{ display:flex; flex-direction:column; min-width:0; }
  .card-media{
    display:grid; place-items:center; width:100%; aspect-ratio:4/5; padding:5% 9% 3%;
    border:1px solid var(--line); border-radius:4px; cursor:pointer; color:inherit;
    background:radial-gradient(closest-side at 50% 62%, color-mix(in srgb, var(--c) 22%, transparent), transparent 80%), var(--tint);
  }
  .card-media svg{ width:100%; height:100%; transition:transform .4s cubic-bezier(.2,.9,.25,1); }
  .card-media:hover svg{ transform:translateY(-6px); }
  .card-brand{ margin:.9rem 0 0; font-size:.88rem; color:var(--ink-soft); }
  .card h3{ font-size:1.6rem; line-height:1.15; margin:.05rem 0 .25rem; }
  .card-notes{ color:var(--ink-soft); font-size:.92rem; margin:0 0 .8rem; }
  .card-foot{ margin-top:auto; display:flex; align-items:center; justify-content:space-between; gap:.6rem; flex-wrap:wrap; }
  .price{ font-weight:500; }
  .empty{ padding:2rem 0 3rem; }
  .empty p{ margin:.4rem 0 1.2rem; color:var(--ink-soft); }

  /* About */
  .about{ background:var(--surface); border-block:1px solid var(--line); }
  .about-teaser-in{ max-width:1180px; margin:0 auto; padding:clamp(2.5rem,6vw,4rem) var(--pad); display:flex; gap:2rem 4rem; align-items:center; justify-content:space-between; }
  .about p{ margin:1rem 0 0; color:var(--ink-soft); max-width:56ch; font-size:1.05rem; }
  .facts{ margin:0; display:grid; gap:1.1rem; align-content:start; }
  .facts div{ border-top:1px solid var(--line); padding-top:.9rem; }
  .facts dt{ font:italic 500 1.4rem var(--serif); }
  .facts dd{ margin:.2rem 0 0; color:var(--ink-soft); }

  /* Footer */
  .foot{ max-width:1180px; margin:0 auto; padding:2.5rem var(--pad); display:flex; flex-wrap:wrap; gap:1.5rem 3rem; align-items:center; justify-content:space-between; }
  .foot .logo{ height:38px; }
  .foot nav{ display:flex; gap:1.5rem; flex-wrap:wrap; }
  .foot a{ text-decoration:none; }
  .foot a:hover{ text-decoration:underline; text-underline-offset:4px; }
  .foot small{ color:var(--ink-soft); flex-basis:100%; }

  /* Dialogs */
  dialog{ border:0; padding:0; background:var(--surface); color:var(--ink); max-width:none; max-height:none; }
  dialog::backdrop{ background:var(--backdrop); }
  dialog.modal{
    width:min(940px, calc(100% - 1.5rem)); max-height:calc(100dvh - 1.5rem); overflow:auto;
    border:1px solid var(--line); border-radius:8px; margin:auto;
  }
  dialog.modal[open]{ animation:pop .22s ease both; }
  @keyframes pop{ from{ opacity:0; transform:scale(.98); } to{ opacity:1; transform:none; } }
  dialog.drawer{
    margin:0 0 0 auto; height:100dvh; width:min(440px,100%); border-left:1px solid var(--line);
    padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
  }
  dialog.drawer[open]{ animation:slide .28s cubic-bezier(.2,.9,.25,1) both; }
  @keyframes slide{ from{ transform:translateX(24px); opacity:0; } to{ transform:none; opacity:1; } }
  .close{
    position:sticky; top:.5rem; z-index:3; display:grid; place-items:center;
    width:44px; height:44px; margin:.5rem .5rem calc(-44px - .5rem) auto;
    border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer;
  }
  .close:hover{ background:var(--tint); }

  /* Product dialog */
  .pd{ display:grid; grid-template-columns:1fr 1fr; }
  .pd-media{ display:grid; place-items:center; padding:2.5rem 3rem;
    background:radial-gradient(closest-side at 50% 60%, color-mix(in srgb, var(--c) 26%, transparent), transparent 82%), var(--tint); }
  .pd-media svg{ width:100%; max-width:280px; height:auto; }
  .pd-info{ padding:2.5rem 2.2rem 2rem; }
  .pd-brand{ margin:0 0 .3rem; color:var(--ink-soft); font-size:.95rem; }
  .pd-info h2{ font-size:clamp(2.2rem,4vw,3rem); margin-bottom:.2rem; padding-right:2.5rem; }
  .pd-kind{ margin:0 0 1rem; color:var(--ink-soft); font-size:.95rem; }
  .pd-desc{ margin:0 0 1.2rem; }
  .notes{ margin:0 0 1.4rem; display:grid; gap:.5rem; }
  .notes div{ display:grid; grid-template-columns:4.5rem 1fr; gap:.8rem; border-top:1px solid var(--line); padding-top:.5rem; }
  .notes dt{ font:italic 500 1.15rem var(--serif); }
  .notes dd{ margin:0; color:var(--ink-soft); }
  .sizes{ display:flex; gap:.6rem; border:0; padding:0; margin:0 0 1.2rem; }
  .sizes legend{ font:italic 500 1.15rem var(--serif); padding:0; margin-bottom:.4rem; }
  .sizeopt{ position:relative; flex:1; border:1px solid var(--line-strong); border-radius:6px; padding:.7rem .9rem; cursor:pointer; display:flex; flex-direction:column; }
  .sizeopt input{ position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; }
  .sizeopt b{ font-weight:500; }
  .sizeopt span{ color:var(--ink-soft); font-size:.92rem; }
  .sizeopt:has(input:checked){ border-color:var(--brand); box-shadow:inset 0 0 0 1px var(--brand); background:var(--tint); }
  .sizeopt:has(input:focus-visible){ outline:2px solid var(--brand); outline-offset:3px; }
  .buy{ display:flex; gap:.9rem; align-items:center; flex-wrap:wrap; }
  .buy .btn{ flex:1; min-width:180px; }
  .qty{ display:inline-flex; align-items:center; border:1px solid var(--line-strong); border-radius:999px; }
  .qty button{ width:44px; height:44px; border:0; border-radius:50%; background:none; color:var(--ink); font-size:1.2rem; cursor:pointer; }
  .qty button:hover{ background:var(--tint); }
  .qty output{ min-width:2ch; text-align:center; font-weight:500; }

  /* Cart drawer */
  .cart{ display:flex; flex-direction:column; height:100%; }
  .cart-head{ display:flex; align-items:center; justify-content:space-between; padding:1rem 1.2rem; border-bottom:1px solid var(--line); }
  .cart-head h2{ font-size:2rem; }
  .cart-head .close{ position:static; margin:0; }
  .cart-body{ flex:1; overflow:auto; padding:.4rem 1.2rem; }
  .line{ display:grid; grid-template-columns:64px 1fr auto; gap:.9rem; padding:1rem 0; border-bottom:1px solid var(--line); }
  .line-img{ background:var(--tint); border-radius:4px; overflow:hidden; display:grid; place-items:center; height:84px; }
  .line-img svg{ width:135%; max-width:none; height:auto; margin-top:6px; }
  .line h3{ font-size:1.3rem; line-height:1.1; }
  .line small{ color:var(--ink-soft); display:block; margin:.15rem 0 .5rem; }
  .line .qty button{ width:36px; height:36px; }
  .line-side{ text-align:right; display:flex; flex-direction:column; justify-content:space-between; align-items:flex-end; }
  .line-side .link{ font-size:.85rem; color:var(--ink-soft); text-decoration:underline; text-underline-offset:3px; min-height:32px; }
  .cart-foot{ padding:1rem 1.2rem 1.3rem; border-top:1px solid var(--line); background:var(--surface); }
  .ship-msg{ margin:0 0 .5rem; font-size:.92rem; color:var(--ink-soft); }
  .bar-track{ height:4px; border-radius:4px; background:var(--tint); overflow:hidden; margin-bottom:1rem; border:1px solid var(--line); }
  .bar-fill{ height:100%; background:var(--brand); transition:width .3s ease; }
  .row{ display:flex; justify-content:space-between; gap:1rem; margin:.15rem 0; }
  .row.total{ font-weight:500; font-size:1.1rem; border-top:1px solid var(--line); padding-top:.6rem; margin-top:.5rem; }
  .cart-foot .btn{ width:100%; margin-top:1rem; }
  .cart-empty{ padding:2.5rem 0; }
  .cart-empty p{ color:var(--ink-soft); margin:.4rem 0 1.2rem; }

  /* Checkout */
  .co{ display:grid; grid-template-columns:1.25fr 1fr; }
  .co-form{ padding:2.5rem 2.2rem 2rem; }
  .co-form h2{ font-size:2.2rem; margin-bottom:1.2rem; }
  .fields{ display:grid; grid-template-columns:1fr 1fr; gap:.9rem; }
  .fields .full{ grid-column:1 / -1; }
  .fields label{ display:grid; gap:.3rem; font-size:.9rem; color:var(--ink-soft); }

  /* Pictures */

  @media (max-width: 820px){

  /* Landing page (first page shown) */

  .ad-pw{ display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:.9rem 1.2rem; align-items:end; border:1px solid var(--line-strong); border-radius:8px; background:var(--surface); padding:1rem 1.2rem 1.2rem; margin-bottom:1.2rem; }

  .ad-pw .err, .ad-pw .muted, .ad-pw .btn{ grid-column:1 / -1; }
  .ad-pw .btn{ justify-self:start; }

  .ad-about-pic{ width:112px; height:140px; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--tint); display:grid; place-items:center; margin-bottom:.6rem; }
  .ad-about-pic img{ width:100%; height:100%; object-fit:cover; display:block; }
  .ad-about-pic-empty{ color:var(--ink-soft); font-size:.78rem; text-align:center; padding:0 .4rem; }

const idSlug = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const compact = s => idSlug(s).replace(/-/g, '');
const brandOf = b => BRAND_ALIAS[b] || b;
const isGeneric = b => !b || /^unbranded\/generic/i.test(b) || b.toLowerCase() === 'arabic'; // not a real brand: no "inspired by"
const isArabian = b => b.toLowerCase() === 'arabic';
const descOf = (kind, name, brand, generic) => generic ? 'A HUBA fragrance.' : (kind === 'oud' ? `HUBA's oud inspired by ${name} from ${brand}.` : `HUBA's fragrance inspired by ${name} from ${brand}.`);
const idSeen = {};
function makeProduct(kind, name, rawBrand, i, savedId){
  const brand = brandOf(rawBrand), generic = isGeneric(rawBrand);
  const base = (kind === 'oud' ? 'oud-' : kind[0] + '-') + idSlug(rawBrand + ' ' + name); // ids come from the sheet text so saved pictures stay attached
  if (!savedId) idSeen[base] = (idSeen[base] || 0) + 1;
  const pal = PALETTES[kind];
  return {
    id: savedId || (idSeen[base] > 1 ? base + '-' + idSeen[base] : base), name,
    gender: GENDER_LABEL[kind],
    color: pal[i % pal.length], shape: SHAPE_LIST[i % SHAPE_LIST.length],
    tags: (kind === 'oud' ? ['oud'] : []).concat(kind === 'arabic' || isArabian(brand) ? ['arabic'] : []),
    inspired: generic ? null : { brand, name },
    desc: descOf(kind, name, brand, generic),
    prices: { ...(kind === 'oud' ? OUD_PRICES : DEFAULT_PRICE) },
    seq: { [kind]: i + 1 }   // position in your sheet: pages list fragrances in this order
  };
}
Object.values(SHEET_ROWS).flat().forEach(r => { if (r[2]) idSeen[r[2]] = 1; }); // saved ids are reserved before new ids are made

const oudByKey = new Map(OUD_ROWS.map(([name, brand], i) => [compact(brandOf(brand)) + '|' + compact(name), OUDS[i]]));
const SHEET_PRODUCTS = { women:[], men:[], unisex:[], arabic:[] };
Object.keys(SHEET_ROWS).forEach(k => SHEET_ROWS[k].forEach(([name, brand, savedId], i) => {
  const hit = oudByKey.get(compact(brandOf(brand)) + '|' + compact(name));
  if (hit) { // already in the Ouds sheet: one product, shown on both pages
    if (k === 'arabic') { if (!hit.tags.includes('arabic')) hit.tags.push('arabic'); } else hit.gender = GENDER_LABEL[k];
    hit.seq[k] = i + 1; hit.name = name;
    if (hit.inspired) hit.inspired.name = name;
    hit.desc = descOf('oud', name, brandOf(brand), !hit.inspired);
  } else SHEET_PRODUCTS[k].push(makeProduct(k, name, brand, i, savedId));
}));

const STAR = Array.from({ length:16 }, (_, i) => { const r = i % 2 ? 7 : 17, a = Math.PI * i / 8 - Math.PI / 2; return (32 + r * Math.cos(a)).toFixed(1) + ',' + (32 + r * Math.sin(a)).toFixed(1); }).join(' ');
const GLYPH = {
  citrus:  c => `<circle cx="32" cy="34" r="17" fill="${c}"/><circle cx="32" cy="34" r="12.5" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.6"/><path d="M32 21.5v25M19.5 34h25M23 25l18 18M41 25L23 43" stroke="#fff" stroke-opacity=".55" stroke-width="1.3" fill="none"/><path d="M34 17c1-6 6-8 11-7-1 5-5 8-11 7z" fill="#5b9a3c"/>`,

  musk:    c => `<circle cx="23" cy="37" r="11" fill="${c}"/><circle cx="38" cy="35" r="13" fill="${c}"/><circle cx="31" cy="27" r="10" fill="${c}"/>`,
  sea:     c => `<path d="M8 40c6-8 12-8 18 0s12 8 18 0 8-6 12-3" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round"/><path d="M8 27c6-8 12-8 18 0s12 8 18 0 8-6 12-3" fill="none" stroke="${c}" stroke-opacity=".55" stroke-width="5" stroke-linecap="round"/>`,
  leaf:    c => `<path d="M14 46C12 24 26 12 50 14 52 38 40 52 14 46z" fill="${c}"/><path d="M16 44C26 34 36 26 46 18" stroke="#fff" stroke-opacity=".55" stroke-width="1.6" fill="none"/>`,
  smoke:   c => `<path d="M24 52c-8-8 8-12 0-20s8-12 0-20M40 52c-8-8 8-12 0-20s8-12 0-20" fill="none" stroke="${c}" stroke-width="3.5" stroke-linecap="round"/>`,

};
function noteStyle(name){
  const n = norm(name);
  for (const [re, type, color] of NOTE_RULES) {
    if (re.test(n)) {
      if (color) return [type, color];
      const hit = NOTE_COLORS[type].find(([r]) => r.test(n));
      return [type, hit ? hit[1] : '#9a6a3c'];
    }
  }
  return ['leaf', '#5b9a3c'];
}
function noteIcon(name){
  const [type, color] = noteStyle(name);
  return `<svg class="note-svg" viewBox="0 0 64 64" aria-hidden="true"><circle class="ni-bg" cx="32" cy="32" r="32"/><g stroke="rgba(3,61,36,.2)" stroke-width="1">${GLYPH[type](color)}</g></svg>`;
}
const noteKey = s => compact(s);
const noteVisual = (name, pics) => pics[noteKey(name)] ? `<img src="${pics[noteKey(name)]}" alt="" loading="lazy" decoding="async">` : noteIcon(name);
function pyramidHTML(p){
  const tiers = NOTE_TIERS.filter(t => p.notes[t].length);
  const owner = runtime.mode === 'viewer';
  if (!tiers.length) return `<section class="fnotes" aria-labelledby="fnTitle"><h2 id="fnTitle">Fragrance Notes</h2><p class="fn-empty">Fragrance notes will be added soon.${owner ? ' <a href="#admin">Add them in Admin</a>.' : ''}</p></section>`;
  return `<section class="fnotes" aria-labelledby="fnTitle"><h2 id="fnTitle">Fragrance Notes</h2>${tiers.map(t => `
    <div class="fn-tier" data-tier="${t}"><h3>${NOTE_LABELS[t]}</h3>
      <div class="fn-row">${p.notes[t].map(n => `<div class="fnote"><span class="fnote-pic">${noteVisual(n, NOTE_PICS)}</span><span class="fnote-name">${esc(n)}</span></div>`).join('')}</div>
    </div>`).join('')}</section>`;
}

function bottle(p, opts = {}) {

      <clipPath id="cl${n}">${s.body('')}</clipPath>

      <rect x="0" y="${s.liq}" width="200" height="${260 - s.liq}" fill="url(#lq${n})"/>

const state = {
  filters: { collection:'all', brand:'All', sort:'featured', q:'', avail:false },
  limit: 24,
  view: 'home',
  keepUntil: 0,
  cart: loadCart(),
  pp: null,
  snap: null,
  authed: false,
  afterLogin: null
};
function loadCart(){
  try {
    const raw = JSON.parse(localStorage.getItem('huba-cart') || '[]');
    if (!Array.isArray(raw)) return [];
    return raw.map(i => ({ id:i.id, size:+i.size, qty:Math.min(10, i.qty | 0) }))
              .filter(i => { const p = byId(i.id); return p && !p.soldOut && p.prices[i.size] && i.qty > 0; });
  } catch (e) { return []; }
}
function saveCart(){ try { localStorage.setItem('huba-cart', JSON.stringify(state.cart)); } catch (e) {} }
function totals(){
  const lines = state.cart.map(i => { const p = byId(i.id); const unit = p.prices[i.size]; return { ...i, p, unit, total: unit * i.qty }; });
  const sub = lines.reduce((s,l) => s + l.total, 0);
  const ship = sub === 0 || sub >= CONFIG.freeShippingOver ? 0 : CONFIG.flatShipping;
  return { lines, sub, ship, total: sub + ship, count: lines.reduce((s,l) => s + l.qty, 0) };
}
function resetFilters(collection = 'all'){
  Object.assign(state.filters, { collection, brand:'All', sort:'featured', q:'', avail:false });
  state.limit = PAGE_SIZE;
  $('#search').value = '';
}

/* ============ Admin login ============ */
// This lock keeps casual visitors out of the admin screen. The store is a single static file, so on its own it is not
// strong security: what really protects the live store is that publishing needs your claude.ai account, and that on your
// own website the admin can only produce a file to upload. Choose a long password.
function sha256hex(msg){
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const bytes = new TextEncoder().encode(msg), l = bytes.length, words = (((l + 8) >> 6) + 1) << 4, w = new Uint32Array(words);
  for (let i = 0; i < l; i++) w[i >> 2] |= bytes[i] << (24 - (i & 3) * 8);
  w[l >> 2] |= 0x80 << (24 - (l & 3) * 8);
  w[words - 1] = l * 8;
  let h0 = 0x6a09e667, h1 = 0xbb67ae85, h2 = 0x3c6ef372, h3 = 0xa54ff53a, h4 = 0x510e527f, h5 = 0x9b05688c, h6 = 0x1f83d9ab, h7 = 0x5be0cd19;
  const s = new Uint32Array(64);
  for (let b = 0; b < words; b += 16) {
    for (let i = 0; i < 16; i++) s[i] = w[b + i];
    for (let i = 16; i < 64; i++) {
      const x = s[i - 15], y = s[i - 2];
      const s0 = ((x >>> 7) | (x << 25)) ^ ((x >>> 18) | (x << 14)) ^ (x >>> 3);
      const s1 = ((y >>> 17) | (y << 15)) ^ ((y >>> 19) | (y << 13)) ^ (y >>> 10);
      s[i] = (s[i - 16] + s0 + s[i - 7] + s1) | 0;
    }
    let a = h0, bb = h1, c = h2, d = h3, e = h4, f = h5, g = h6, h = h7;
    for (let i = 0; i < 64; i++) {
      const S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + K[i] + s[i]) | 0;
      const S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
      const maj = (a & bb) ^ (a & c) ^ (bb & c);
      const t2 = (S0 + maj) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = bb; bb = a; a = (t1 + t2) | 0;
    }
    h0 = (h0 + a) | 0; h1 = (h1 + bb) | 0; h2 = (h2 + c) | 0; h3 = (h3 + d) | 0; h4 = (h4 + e) | 0; h5 = (h5 + f) | 0; h6 = (h6 + g) | 0; h7 = (h7 + h) | 0;
  }
  return [h0, h1, h2, h3, h4, h5, h6, h7].map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}
const AUTH_ROUNDS = 20000;
const normUser = u => String(u).trim().toLowerCase();
function hashPw(user, pw, salt){
  let h = sha256hex(salt + '|' + normUser(user) + '|' + pw);
  for (let i = 0; i < AUTH_ROUNDS; i++) h = sha256hex(h + salt + pw);
  return h;
}
function randomHex(n){
  const a = new Uint8Array(n);
  if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(a); else for (let i = 0; i < n; i++) a[i] = Math.floor(Math.random() * 256);
  return [...a].map(x => x.toString(16).padStart(2, '0')).join('');
}
const makeAuth = (user, pw) => { const salt = randomHex(16); return { user:user.trim(), salt, hash:hashPw(user, pw, salt) }; };
const checkPw = (auth, user, pw) => normUser(user) === normUser(auth.user) && hashPw(auth.user, pw, auth.salt) === auth.hash;
// Starting login (username "admin"). Change the password in Admin, then Save and publish.
const ADMIN_DEFAULT = {"user": "admin", "salt": "a433a44696b00c34a2201db9cee8bcc9", "hash": "0f68891c3e140c5f389ddc171d63e27c009ed0e16c6d600fa2ce2fd1c27b6140"};
const ADMIN_AUTH = (CATALOG.adminAuth && CATALOG.adminAuth.hash) ? CATALOG.adminAuth : ADMIN_DEFAULT;

const isAuthed = () => { if (state.authed) return true; try { return sessionStorage.getItem('huba-admin') === '1'; } catch (e) { return false; } };
function setAuthed(on){
  state.authed = on;
  try { if (on) sessionStorage.setItem('huba-admin', '1'); else sessionStorage.removeItem('huba-admin'); } catch (e) {}
  updateAdminLink();
}
function updateAdminLink(){ $('#adminLink').hidden = !isAuthed(); }
let loginFails = 0, lockUntil = 0;
function buildLogin(){
  $('#loginLogo').src = $('#logo').src;
  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const err = $('#loginErr'), btn = $('#loginBtn'), now = Date.now();
    if (now < lockUntil) { err.textContent = `Too many attempts. Try again in ${Math.ceil((lockUntil - now) / 1000)} seconds.`; err.hidden = false; return; }
    err.hidden = true; btn.disabled = true; btn.textContent = 'Checking...';
    await new Promise(r => setTimeout(r, 30)); // let the button update before the calculation
    let ok = false, serverMsg = '';
    if (runtime.probe) await runtime.probe;
    if (runtime.mode === 'server') {
      try { const j = await apiCall('login', { user:$('#loginUser').value, pass:$('#loginPass').value }); runtime.csrf = j.csrf; runtime.user = j.user; ok = true; }
      catch (ex) { serverMsg = ex.status === 401 ? 'Incorrect username or password.' : (ex.status === 429 ? ex.message : "The website couldn't check your login. Try again in a moment."); }
    } else ok = checkPw(ADMIN_AUTH, $('#loginUser').value, $('#loginPass').value);
    btn.disabled = false; btn.textContent = 'Log in';
    $('#loginPass').value = '';
    if (ok) {
      loginFails = 0; setAuthed(true);
      try { sessionStorage.setItem('huba-entered', '1'); } catch (ex) {}
      const dest = state.afterLogin || '#admin'; state.afterLogin = null;
      location.hash = dest;
    } else {
      loginFails++;
      if (serverMsg && !/^Incorrect/.test(serverMsg)) err.textContent = serverMsg;
      else if (loginFails >= 5) { lockUntil = Date.now() + 60000; loginFails = 0; err.textContent = 'Too many attempts. Wait 60 seconds and try again.'; }
      else err.textContent = 'Incorrect username or password.';
      err.hidden = false; $('#loginPass').focus();
    }
  });
}

/* ============ Dialog helpers ============ */
function openDialog(d){ if (!d.open) d.showModal(); document.body.style.overflow = 'hidden'; }
document.addEventListener('click', e => {
  const c = e.target.closest('[data-close]');
  if (c) c.closest('dialog').close();
  if (e.target instanceof HTMLDialogElement) { // backdrop click: pointer is outside the dialog box
    const r = e.target.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) e.target.close();
  }
});
document.querySelectorAll('dialog').forEach(d => d.addEventListener('close', () => {
  if (!document.querySelector('dialog[open]')) document.body.style.overflow = '';
}));

const HERO = {
  women:  { color:'#e8a0b4', blurb:'Fragrances inspired by well-loved perfumes for her.' },
  men:    { color:'#6f9fb8', blurb:'Fragrances inspired by well-loved perfumes for him.' },
  unisex: { color:'#e0a02a', blurb:'Scents made to be worn by anyone.' },
  arabic: { color:'#c9a45a', blurb:'Arabian perfumes and traditional ouds.' },
  oud:    { color:'#7a4a22', blurb:'The HUBA oud collection.' }
};
function buildHero(){
  $('#arch').innerHTML = bottle({ name:'Featured', shape:'classic', color:HERO.women.color }, { inherit:true });
  $('#famPicker').innerHTML = Object.keys(HERO).map(k => `<button class="chip" type="button" data-hero="${k}" aria-pressed="false">${esc(COLLECTIONS[k].label)}</button>`).join('');
  $('#famPicker').addEventListener('click', e => { const b = e.target.closest('[data-hero]'); if (b) setHero(b.dataset.hero); });
  setHero('women');
}
function setHero(key){
  const h = HERO[key];
  $('#arch').style.setProperty('--c', h.color);
  document.querySelectorAll('#famPicker .chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.hero === key)));
  $('#famDetail').innerHTML = `<p>${esc(h.blurb)}</p><p class="fam-notes">${plural(countIn(key), 'fragrance')}</p>`;
  $('#famCta').textContent = 'Shop ' + COLLECTIONS[key].label;
  $('#famCta').href = '#' + key;
}

/* ============ Fragrances menu ============ */
function buildMenu(){
  const items = Object.keys(COLLECTIONS).filter(k => k !== 'all' && k !== 'oud').map(k => [k, COLLECTIONS[k].label, countIn(k)]);
  $('#menuLinks').innerHTML = items.map(([k,t,n]) => `<a class="menu-link" href="#${k}" data-key="${k}"><b>${esc(t)}</b><span>${plural(n, 'fragrance')}</span></a>`).join('');
  const btn = $('#productsBtn'), menu = $('#productsMenu');
  const setOpen = o => { menu.hidden = !o; btn.setAttribute('aria-expanded', String(o)); };
  btn.addEventListener('click', () => setOpen(menu.hidden));
  menu.addEventListener('click', e => { if (e.target.closest('a')) setOpen(false); });
  document.addEventListener('click', e => { if (!menu.hidden && !e.target.closest('#productsMenu') && !e.target.closest('#productsBtn')) setOpen(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !menu.hidden) { setOpen(false); btn.focus(); } });
  window.addEventListener('hashchange', () => setOpen(false));
}

function syncToolbar(){

  $('#brandSelect').value = f.brand;

const hay = p => p._s || (p._s = searchText(p));
function searchText(p){
  return norm([p.name, p.gender || '', p.tags.join(' '), p.inspired ? p.inspired.brand + ' ' + p.inspired.name : '', ...p.notes.top, ...p.notes.mid, ...p.notes.base].join(' '));
}
function visible(){
  const f = state.filters, tokens = norm(f.q).split(/\s+/).filter(Boolean);
  let list = PRODUCTS.filter(p =>
    COLLECTIONS[f.collection].test(p) &&
    (f.brand === 'All' || (p.inspired && p.inspired.brand === f.brand)) &&
    (!f.avail || !p.soldOut) &&
    tokens.every(t => hay(p).includes(t)));
  if (f.sort === 'featured' && f.collection !== 'all') list = [...list].sort((a,b) => ((a.seq && a.seq[f.collection]) || 1e9) - ((b.seq && b.seq[f.collection]) || 1e9)); // your sheet order
  if (f.sort === 'low')  list = [...list].sort((a,b) => lowest(a) - lowest(b));
  if (f.sort === 'high') list = [...list].sort((a,b) => lowest(b) - lowest(a));
  if (f.sort === 'name') list = [...list].sort((a,b) => a.name.localeCompare(b.name));
  if (f.sort === 'brand') list = [...list].sort((a,b) => (a.inspired ? a.inspired.brand : 'zzz').localeCompare(b.inspired ? b.inspired.brand : 'zzz') || a.name.localeCompare(b.name));
  return list;
}

/* ============ Cart ============ */
function addToCart(id, size, qty){
  if (byId(id).soldOut) return;
  const hit = state.cart.find(i => i.id === id && i.size === size);
  if (hit) hit.qty = Math.min(10, hit.qty + qty); else state.cart.push({ id, size, qty });
  saveCart(); renderCart();
  say(`${byId(id).name}, ${size} ml added to cart. ${totals().count} items in cart.`);
}
function renderCart(){
  const t = totals();
  const badge = $('#cartCount');
  badge.textContent = t.count;
  badge.dataset.zero = String(t.count === 0);
  $('#cartOpen').setAttribute('aria-label', `Cart, ${plural(t.count, 'item')}`);

  if (!t.lines.length) {
    $('#cartBody').innerHTML = `<div class="cart-empty"><h3 style="font-size:1.8rem">Your cart is empty</h3><p>Add a fragrance to get started.</p><button class="btn ghost" type="button" data-browse>Browse fragrances</button></div>`;
    $('#cartFoot').innerHTML = '';
    $('#cartFoot').hidden = true;
    return;
  }
  $('#cartFoot').hidden = false;
  $('#cartBody').innerHTML = t.lines.map(l => `
    <div class="line" style="--c:${l.p.color}">
      <div class="line-img">${media(l.p)}</div>
      <div>
        <h3>${esc(l.p.name)}</h3>
        <small>${l.size} ml, ${money(l.unit)} each</small>
        <div class="qty" role="group" aria-label="Quantity for ${esc(l.p.name)}, ${l.size} ml">
          <button type="button" data-act="dec" data-key="${l.id}:${l.size}" aria-label="Decrease quantity">&minus;</button>
          <output>${l.qty}</output>
          <button type="button" data-act="inc" data-key="${l.id}:${l.size}" aria-label="Increase quantity">+</button>
        </div>
      </div>
      <div class="line-side">
        <span class="price">${money(l.total)}</span>
        <button class="link" type="button" data-act="rm" data-key="${l.id}:${l.size}" aria-label="Remove ${esc(l.p.name)}, ${l.size} ml">Remove</button>
      </div>
    </div>`).join('');

  const left = CONFIG.freeShippingOver - t.sub;
  const pct = Math.min(100, Math.round(t.sub / CONFIG.freeShippingOver * 100));
  $('#cartFoot').innerHTML = `
    <p class="ship-msg">${left > 0 ? `Add ${money(left)} more for free delivery.` : 'Delivery is free on this order.'}</p>
    <div class="bar-track" aria-hidden="true"><div class="bar-fill" style="width:${pct}%"></div></div>
    <div class="row"><span>Subtotal</span><span>${money(t.sub)}</span></div>
    <div class="row"><span>Delivery</span><span>${t.ship ? money(t.ship) : 'Free'}</span></div>
    <div class="row total"><span>Total</span><span>${money(t.total)}</span></div>

}

$('#cartOpen').addEventListener('click', openCart);
$('#cartDrawer').addEventListener('click', e => {
  if (e.target.closest('[data-browse]')) { $('#cartDrawer').close(); location.hash = '#shop'; return; }
  if (e.target.closest('[data-checkout]')) { $('#cartDrawer').close(); openCheckout(); return; }
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const [id, size] = b.dataset.key.split(':');
  const item = state.cart.find(i => i.id === id && i.size === +size);
  if (!item) return;
  const name = byId(id).name;
  if (b.dataset.act === 'inc') item.qty = Math.min(10, item.qty + 1);
  if (b.dataset.act === 'dec') item.qty = Math.max(1, item.qty - 1);
  if (b.dataset.act === 'rm') { state.cart = state.cart.filter(i => i !== item); say(`${name} removed from cart.`); }
  saveCart(); renderCart();
  const again = $(`#cartBody [data-key="${b.dataset.key}"][data-act="${b.dataset.act === 'rm' ? 'inc' : b.dataset.act}"]`);
  (again || $('#cartBody button') || $('#cartDrawer .close')).focus();
});

function orderText(o){
  const c = o.customer;
  return [`Order ${o.number}`, `Date: ${new Date(o.createdAt).toLocaleString(CONFIG.locale)}`, '',
    `Name: ${c.name}`, `Email: ${c.email}`, `Phone: ${c.phone}`, `Address: ${c.address}, ${c.city}${c.postal ? ' ' + c.postal : ''}`, `Payment: ${o.payment}`, ...(c.notes ? [`Notes: ${c.notes}`] : []), '',
    'Items:', ...o.items.map(i => `- ${i.name}${i.inspiredBy ? ' (inspired by ' + i.inspiredBy + ')' : ''}, ${i.sizeMl} ml x ${i.qty} = ${money(i.unitPrice * i.qty)}`), '',
    `Subtotal: ${money(o.subtotal)}`, `Delivery: ${o.delivery ? money(o.delivery) : 'Free'}`, `Total: ${money(o.total)}`].join('\n');
}
function orderPayload(o){
  const c = o.customer;
  return { _subject:`New HUBA order ${o.number} (${money(o.total)})`, _template:'table', _captcha:'false', _honey:'',
    order_number:o.number, name:c.name, email:c.email, phone:c.phone, address:c.address, city:c.city, postal_code:c.postal, notes:c.notes, payment:o.payment,
    items:o.items.map(i => `${i.name}${i.inspiredBy ? ' (inspired by ' + i.inspiredBy + ')' : ''}, ${i.sizeMl} ml x ${i.qty} = ${money(i.unitPrice * i.qty)}`).join('\n'),
    subtotal:money(o.subtotal), delivery:o.delivery ? money(o.delivery) : 'Free', total:money(o.total), currency:o.currency };
}
$('#checkout').addEventListener('click', async e => {
  if (!e.target.closest('#coCopy')) return;
  const ta = $('#coText'), btn = $('#coCopy');
  try { await navigator.clipboard.writeText(ta.value); }
  catch (ex) { ta.focus(); ta.select(); try { document.execCommand('copy'); } catch (e2) {} }
  btn.textContent = 'Copied. Now paste it into an email.'; setTimeout(() => { btn.textContent = 'Copy order details'; }, 3000);
});
const orderMailto = o => `mailto:${CONFIG.orderEmail}?subject=${encodeURIComponent('Order ' + o.number)}&body=${encodeURIComponent(orderText(o))}`;
$('#checkout').addEventListener('submit', async e => {
  e.preventDefault();
  const form = e.target, err = $('#coErr'), btn = $('#coSubmit'), mail = $('#coMail');
  const data = Object.fromEntries(new FormData(form).entries());
  const t = totals();
  const order = {
    number: state.orderNo || ('HUBA-' + Math.random().toString(36).slice(2, 8).toUpperCase()),
    createdAt: new Date().toISOString(),
    customer: { name:data.name, email:data.email, phone:data.phone, address:data.address, city:data.city, postal:data.postal || '', notes:data.notes || '' },
    payment: data.payment,
    currency: CONFIG.currency,
    items: t.lines.map(l => ({ id:l.id, name:l.p.name, inspiredBy:l.p.inspired ? l.p.inspired.brand : '', sizeMl:l.size, qty:l.qty, unitPrice:l.unit })),
    subtotal: t.sub, delivery: t.ship, total: t.total
  };
  err.hidden = true; mail.hidden = true; $('#coManual').hidden = true;
  btn.disabled = true; btn.textContent = 'Placing order...';
  try {
    if (runtime.mode === 'server') {
      await apiCall('order', { order, website:'' });
    } else if (CONFIG.orderEndpoint) {
      const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 20000);
      let res;
      try { res = await fetch(CONFIG.orderEndpoint, { method:'POST', headers:{ 'Content-Type':'application/json', 'Accept':'application/json' }, body:JSON.stringify(orderPayload(order)), signal:ctl.signal }); }
      finally { clearTimeout(timer); }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const j = await res.json().catch(() => null);
      if (j && (j.success === false || j.success === 'false')) throw new Error('rejected');
    }
    state.cart = []; saveCart(); renderCart(); state.orderNo = null;
    showConfirmation(order);
  } catch (ex) {
    err.textContent = `We couldn't send your order automatically. Try again, or email it to ${CONFIG.orderEmail}. Your order is not placed until it is sent.`;
    err.hidden = false;
    mail.href = orderMailto(order); mail.hidden = false;

// The store is a static page, so "saving" means rebuilding this page with the new prices and

const MAX_PIC_PX = 640;          // pictures are shrunk to this size before saving
const PIC_BUDGET = 12 * 1024 * 1024; // warn above this many bytes of pictures

const runtime = {

async function detectRuntime(){

    const can = !!(artifact && user && ((typeof user.canEdit === 'function' && user.canEdit()) || (typeof user.isOwner === 'function' && user.isOwner())));
    runtime.artifact = artifact;
    runtime.mode = can ? 'viewer' : 'visitor';
  } catch (e) { runtime.mode = 'visitor'; }
  updateAdminLink();
  if (state.view === 'admin') renderAdmin();

}

const AD_PAGE = 60;
const admin = { prices:{}, images:{}, soldOut:new Set(), notes:{}, notePics:{}, f:{ q:'', coll:'all', edited:false, nopic:false, oos:false, nonotes:false }, limit:AD_PAGE, busy:false, built:false };
function adminReset(){
  PRODUCTS.forEach(p => { admin.prices[p.id] = { ...SAVED_PRICES[p.id] }; admin.images[p.id] = SAVED_IMAGES[p.id] || null; admin.notes[p.id] = JSON.parse(SAVED_NOTES[p.id]); });

const isEdited = id => SIZES.some(s => admin.prices[id][s] !== SAVED_PRICES[id][s]) || (admin.images[id] || null) !== (SAVED_IMAGES[id] || null)
  || admin.soldOut.has(id) !== SAVED_SOLD.has(id) || JSON.stringify(admin.notes[id]) !== SAVED_NOTES[id];

/* ---- build the catalogue data and the full page to publish ---- */
function buildCatalog(){
  const prices = {}, images = {};
  PRODUCTS.forEach(p => {
    const w = admin.prices[p.id], d = DEFAULT_PRICES[p.id];
    if (SIZES.some(s => w[s] !== d[s])) prices[p.id] = w;

  const soldOut = PRODUCTS.filter(p => admin.soldOut.has(p.id)).map(p => p.id);
  const notes = {};
  PRODUCTS.forEach(p => { const n = admin.notes[p.id]; if (NOTE_TIERS.some(t => n[t].length)) notes[p.id] = { top:n.top, mid:n.mid, base:n.base }; });
  const notePics = {};

  const images2 = { ...images }; if (admin.images.about) images2.about = admin.images.about;
  return { version:2, savedAt:new Date().toISOString(), prices, images:images2, soldOut, notes, notePics, ...(runtime.mode !== 'server' && JSON.stringify(admin.auth) !== JSON.stringify(ADMIN_DEFAULT) ? { adminAuth:admin.auth } : {}) };
}
function buildDocument(data){

/* ---- pictures ---- */
function readAsDataURL(file){
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('read')); r.readAsDataURL(file); });
}
async function fileToJpeg(file, max = MAX_PIC_PX){
  if (!file.type.startsWith('image/')) throw new Error('not-image');
  const src = await readAsDataURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('decode')); i.src = src; });
  const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
  return c.toDataURL('image/jpeg', 0.82);
}

/* ---- bulk tools ---- */
function bulkSet(){
  const vals = SIZES.map(s => parseInt($('#bk' + s).value, 10));
  if (!vals.some(v => v > 0)) { adMsg('Enter at least one price to apply.', 'error'); return; }
  const list = adVisible();
  list.forEach(p => SIZES.forEach((s, i) => { if (vals[i] > 0) admin.prices[p.id][s] = vals[i]; }));
  renderAdList(); updateStatus();
  adMsg(`Prices set on ${plural(list.length, 'fragrance')}. Nothing is live until you press Save.`, 'ok');
}
function bulkPercent(){
  const pct = parseFloat($('#bkPct').value), step = +$('#bkRound').value;
  if (!Number.isFinite(pct)) { adMsg('Enter a percentage, for example 10 or -5.', 'error'); return; }
  const list = adVisible();
  list.forEach(p => SIZES.forEach(s => {
    const cur = admin.prices[p.id][s];
    if (Number.isFinite(cur)) admin.prices[p.id][s] = Math.max(1, Math.round(cur * (1 + pct / 100) / step) * step);
  }));
  renderAdList(); updateStatus();
  adMsg(`Prices changed by ${pct}% on ${plural(list.length, 'fragrance')}. Nothing is live until you press Save.`, 'ok');
}
function bulkStock(out){
  const list = adVisible();
  list.forEach(p => { if (out) admin.soldOut.add(p.id); else admin.soldOut.delete(p.id); });
  renderAdList(); updateStatus();
  adMsg(`${plural(list.length, 'fragrance')} marked ${out ? 'out of stock' : 'available'}. Nothing is live until you press Save.`, 'ok');
}
const picKey = s => norm(s).replace(/[^a-z0-9]/g, '');
async function bulkPictures(files){
  const full = new Map(), named = new Map();
  const add = (m, k, p) => { if (!m.has(k)) m.set(k, []); m.get(k).push(p); };
  PRODUCTS.forEach(p => { add(named, picKey(p.name), p); add(full, picKey((p.inspired ? p.inspired.brand + ' ' : '') + p.name), p); });
  let ok = 0; const miss = [];
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    adMsg(`Processing picture ${i + 1} of ${files.length}...`, '');
    const k = picKey(f.name.replace(/\.[^.]+$/, ''));
    const hit = (full.get(k) && full.get(k).length === 1 ? full.get(k) : null) || (named.get(k) && named.get(k).length === 1 ? named.get(k) : null);
    if (!hit) { miss.push(f.name + (named.get(k) && named.get(k).length > 1 ? ' (several fragrances share this name: add the brand)' : '')); continue; }
    try { admin.images[hit[0].id] = await fileToJpeg(f); ok++; } catch (e) { miss.push(f.name + ' (not a picture this browser can read)'); }
  }
  renderAdList(); updateStatus();
  adMsg(`Matched ${ok} of ${files.length} pictures.` + (miss.length ? ' Not matched: ' + miss.join(', ') + '.' : '') + ' Nothing is live until you press Save.', miss.length ? 'error' : 'ok');
}

/* ---- save ---- */
const DRAFT_KEY = 'huba-admin-draft';
function stashDraft(){ try { sessionStorage.setItem(DRAFT_KEY, JSON.stringify({ prices:admin.prices, images:admin.images, soldOut:[...admin.soldOut], notes:admin.notes, notePics:admin.notePics, auth:admin.auth, about:admin.images.about })); } catch (e) {} }
function clearDraft(){ try { sessionStorage.removeItem(DRAFT_KEY); } catch (e) {} }
function restoreDraft(){
  try {
    const d = JSON.parse(sessionStorage.getItem(DRAFT_KEY) || 'null');
    if (!d) return false;
    PRODUCTS.forEach(p => { if (d.prices && d.prices[p.id]) admin.prices[p.id] = { ...d.prices[p.id] }; if (d.images && p.id in d.images) admin.images[p.id] = d.images[p.id]; });
    if (d.soldOut) admin.soldOut = new Set(d.soldOut);
    if (d.notes) PRODUCTS.forEach(p => { if (d.notes[p.id]) admin.notes[p.id] = d.notes[p.id]; });
    if (d.notePics) admin.notePics = d.notePics;
    if ('about' in d) admin.images.about = d.about;
    if (d.auth && d.auth.hash) admin.auth = d.auth;
    clearDraft();
    return true;
  } catch (e) { return false; }
}
async function adSave(){
  if (admin.busy) return;
  admin.busy = true; updateStatus();
  try {
    if (runtime.mode === 'server') {
      adMsg('Saving...', '');
      const j = await apiCall('save', { base: SERVER_SAVED_AT, catalog: buildCatalog() });
      SERVER_SAVED_AT = j.catalog.savedAt || '';
      clearDraft(); applyCatalog(j.catalog); refreshViews();
      if (state.view === 'admin') { renderAdList(); updateStatus(); }
      adMsg('Saved. Your changes are live on the website now.', 'ok');
    } else if (runtime.mode === 'viewer') {
      const html = buildDocument(buildCatalog());
      adMsg('Publishing...', '');
      adMsg('Publishing...', '');
      stashDraft();
      await runtime.artifact.publish(html);
      clearDraft();
      SAVED_ABOUT_IMAGE = admin.images.about || null; ABOUT_IMAGE = SAVED_ABOUT_IMAGE;
      adMsg('Published. The store is updating with your changes.', 'ok');
    } else {
      const html = buildDocument(buildCatalog());
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([html], { type:'text/html' }));
      a.download = 'index.html';
      document.body.appendChild(a); a.click(); a.remove();
      adMsg('Downloaded index.html. Upload it to your web host to replace the current store file.', 'ok');
    }
  } catch (e) {
    const code = e && e.code;
    if (runtime.mode === 'server') {
      if (e.status === 401 || e.status === 403) { adMsg('Your login has expired. Log in again, then press Save.', 'error'); stashDraft(); setAuthed(false); setTimeout(() => { location.hash = '#login'; }, 1200); }
      else if (e.status === 409) { stashDraft(); adMsg('Someone saved newer changes while you were editing. The page is reloading and your edits will be restored. Then press Save again.', 'error'); setTimeout(() => location.reload(), 2200); }
      else if (e.status === 413) adMsg('Too much to save at once. Remove some new pictures or save in smaller steps.', 'error');
      else if (e.status && e.status < 500) adMsg(e.message, 'error');
      else adMsg("The website couldn't save your changes. Your edits are still here. Try again in a moment.", 'error');
    }
    else if (code === 'conflict') adMsg('Someone else published a newer version. The page is reloading and your changes will be restored.', 'error');
    else if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required' || code === 'capability_disabled' || code === 'not_declared') adMsg("You don't have permission to publish this store. Ask the page owner for edit access.", 'error');
    else if (code === 'too_large') adMsg('The store is too large to publish. Remove some pictures, or use smaller ones.', 'error');
    else if (code === 'rate_limited') adMsg('Publishing too often. Wait a minute, then try again.', 'error');
    else adMsg("Couldn't publish. Your changes are still here. Try again in a moment.", 'error');
  }
  admin.busy = false; updateStatus();
}

/* ============ Website server (optional): live updates without uploading files ============ */
// With api.php next to index.html, the Admin saves straight to your website and customers see changes at once.
let SERVER_SAVED_AT = '';
async function apiCall(action, body, method = 'POST'){
  const opts = { method, credentials:'same-origin', cache:'no-store', headers:{ 'Accept':'application/json' } };
  if (method === 'POST') { opts.headers['Content-Type'] = 'application/json'; if (runtime.csrf) opts.headers['X-CSRF'] = runtime.csrf; opts.body = JSON.stringify(body || {}); }
  const r = await fetch(CONFIG.api + '?action=' + action, opts);
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok || !j || j.ok === false) { const err = new Error((j && j.error) || ('HTTP ' + r.status)); err.status = r.status; err.data = j; throw err; }
  return j;
}
async function probeServer(){
  try {
    const j = await apiCall('ping', null, 'GET');
    if (j.app !== 'huba') return false;
    runtime.mode = 'server';
    if (j.authed) { runtime.csrf = j.csrf || ''; runtime.user = j.user || ''; setAuthed(true); }
    return true;
  } catch (e) { return false; }
}
async function checkServerSession(){
  try {
    const j = await apiCall('ping', null, 'GET');
    if (!j.authed) { setAuthed(false); state.afterLogin = '#admin'; location.hash = '#login'; return; }
    runtime.csrf = j.csrf || runtime.csrf; runtime.user = j.user || runtime.user; $('#adUser').textContent = runtime.user || admin.auth.user;
  } catch (e) {}
}
function applyCatalog(cat){
  CATALOG = cat || {};
  ABOUT_IMAGE = (CATALOG.images && CATALOG.images.about) || null; SAVED_ABOUT_IMAGE = ABOUT_IMAGE;
  const sold = new Set(CATALOG.soldOut || []);
  PRODUCTS.forEach(p => {
    p.prices = { ...DEFAULT_PRICES[p.id], ...((CATALOG.prices && CATALOG.prices[p.id]) || {}) };
    const im = CATALOG.images && CATALOG.images[p.id]; if (im) p.image = im; else delete p.image;
    const n = (CATALOG.notes && CATALOG.notes[p.id]) || {};
    p.notes = { top:[...(n.top || [])], mid:[...(n.mid || [])], base:[...(n.base || [])] };
    p.soldOut = sold.has(p.id); p._s = undefined;
  });
  NOTE_PICS = { ...(CATALOG.notePics || {}) };
  SOLD_OUT = new Set(sold); SAVED_SOLD = new Set(sold);
  SAVED_PRICES = Object.fromEntries(PRODUCTS.map(p => [p.id, { ...p.prices }]));
  SAVED_IMAGES = Object.fromEntries(PRODUCTS.map(p => [p.id, p.image || null]));
  SAVED_NOTES = Object.fromEntries(PRODUCTS.map(p => [p.id, JSON.stringify(p.notes)]));
  state.cart = loadCart();
}
function refreshViews(){
  renderFeatured(); renderCart(); renderGrid(); renderAbout();
  if (state.view === 'product' && state.pp) { const p = byId(state.pp.p.id); if (p) { state.pp.p = p; renderProductPage(); } }
  if (admin.built) adminReset();
}
async function loadServerCatalog(ms){
  if (!CONFIG.api || window.claude) return false;
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch('catalog.json?t=' + Date.now(), { cache:'no-store', signal:ctl.signal });
    if (!r.ok) return false;
    const c = await r.json();
    if (!c || typeof c !== 'object' || Array.isArray(c)) return false;
    SERVER_SAVED_AT = c.savedAt || '';
    applyCatalog(c); return true;
  } catch (e) { return false; } finally { clearTimeout(t); }
}
