<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUBA Fragrances — Coming Soon</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap');

  :root{
    --forest: #05663b;
    --forest-deep: #033d24;
    --leaf: #6bbf59;
    --mist: #f7f9f6;
    --paper: #fbfcfa;
    --line: rgba(5,102,59,0.18);
  }

  *{ box-sizing:border-box; }

  html,body{
    height:100%;
    margin:0;
  }

  body{
    background:
      radial-gradient(1200px 700px at 20% 15%, rgba(107,191,89,0.10), transparent 60%),
      radial-gradient(1000px 600px at 85% 85%, rgba(5,102,59,0.08), transparent 55%),
      var(--mist);
    font-family: 'Jost', sans-serif;
    color: var(--forest-deep);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }

  /* thin botanical-ish frame, quiet */
  .frame{
    position:fixed;
    inset:22px;
    border:1px solid var(--line);
    pointer-events:none;
  }

  .stage{
    text-align:center;
    padding: 4vh 6vw;
    max-width: 720px;
    display:flex;
    flex-direction:column;
    align-items:center;
    animation: rise 1.1s cubic-bezier(.2,.9,.25,1) both;
  }

  @keyframes rise{
    from{ opacity:0; transform: translateY(14px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .logo-wrap{
    width: min(78vw, 520px);
    margin-bottom: 3.4rem;
    filter: drop-shadow(0 18px 34px rgba(3,61,36,0.14));
  }
  .logo-wrap img{
    width:100%;
    height:auto;
    display:block;
  }

  .divider{
    width: 46px;
    height: 1px;
    background: var(--forest);
    opacity:.55;
    margin: 0 0 1.6rem;
  }

  .eyebrow{
    font-family:'Jost', sans-serif;
    font-weight:500;
    font-size: 0.72rem;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--forest);
    margin: 0 0 1.1rem;
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-style:italic;
    font-size: clamp(1.9rem, 4.4vw, 2.9rem);
    line-height:1.15;
    margin: 0 0 1rem;
    color: var(--forest-deep);
  }

  p.sub{
    font-family:'Jost', sans-serif;
    font-weight:300;
    font-size: 1rem;
    line-height:1.7;
    letter-spacing:0.01em;
    color: rgba(3,61,36,0.72);
    margin: 0;
    max-width: 480px;
  }

  .scent-note{
    margin-top: 2.8rem;
    display:flex;
    align-items:center;
    gap: 0.6rem;
    font-family:'Jost', sans-serif;
    font-weight:400;
    font-size: 0.68rem;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color: var(--leaf);
  }
  .scent-note::before,
  .scent-note::after{
    content:"";
    width: 22px;
    height:1px;
    background: var(--leaf);
    opacity:.7;
  }

  @media (prefers-reduced-motion: reduce){
    .stage{ animation:none; }
  }

  @media (max-width: 480px){
    .frame{ inset:12px; }
    .logo-wrap{ margin-bottom: 2.4rem; }
  }

  .enter-tab{
    display:inline-block;
    margin: 0 0 1rem;
    padding: 0.65rem 2.2rem;
    font-family:'Jost', sans-serif;
    font-weight:500;
    font-size: 0.78rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--paper);
    background: var(--forest);
    border-radius: 999px;
    text-decoration:none;
    transition: background 0.25s ease, transform 0.25s ease;
  }
  .enter-tab:hover{
    background: var(--forest-deep);
    transform: translateY(-1px);
  }
</style>
</head>
